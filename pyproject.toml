[project]
name = "elpisai"
version = "2.1.13"
description = "Elpis structural-guidance primitive with an end-to-end validated-source runtime"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
trm = [
  "einops>=0.7",
  "huggingface-hub>=0.25",
  "pydantic>=2.0",
  "safetensors>=0.4",
  "torch>=2.2",
]

[project.scripts]
elpis = "elpis_reference.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  "src",
  "components",
  "components/Pipeline/P0ControlProtocol/src",
  "components/TRMFractalSpine/src",
  "components/Grid81StructuralSemantics/src",
  "components/Grid81TypedProjectionCompiler/src",
  "components/Grid81StructuralGroupProjectionCompiler/src",
  "components/Grid81DeterministicStructuralAdjudicator/src",
  "components/Grid81DeterministicCapabilityAuthorityEvaluator/src",
  "components/Grid81DeterministicCapabilityConsumptionCompiler/src",
  "components/Grid81DeterministicCapabilityApplicationExecutor/src",
  "components/Grid81DeterministicCanonicalPromotionPlanner/src",
  "components/CNumPyCortex/src",
  "native/elpis-header/src",
  "runtime/R0/src",
  "runtime/R1/src",
]
include = [
  "elpis*",
  "elpis_reference*",
  "DarwinianMatrix*",
  "elpis_p0*",
  "elpis_fractal_spine*",
  "elpis_grid81_semantics*",
  "elpis_grid81_typed*",
  "elpis_grid81_groups*",
  "elpis_grid81_adjudication*",
  "elpis_grid81_capability_authority*",
  "elpis_grid81_consumption_compiler*",
  "elpis_grid81_application_executor*",
  "elpis_grid81_promotion_planner*",
  "c_numpy_cortex*",
  "elpis_header*",
  "elpis_runtime_r0*",
  "elpis_runtime_r1*",
]
exclude = ["DarwinianMatrix.tests*"]

[tool.setuptools.package-data]
elpis_reference = [
  "vendor/fprm/AUTHORITY.json",
  "vendor/fprm/all_config.yaml",
  "vendor/fprm/sudoku_inference_config.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
