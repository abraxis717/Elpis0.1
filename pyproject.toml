[project]
name = "elpis-canonical"
version = "1.1.1"
description = "Deterministic structural AI core with Grid81 semantics, HACF retrieval, and qualified offline runtime transactions"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = []
addopts = "-v"
