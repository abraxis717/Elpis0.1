[project]
name = "elpis"
version = "2.0.0"
description = "Elpis structural-guidance primitive with an end-to-end validated-source runtime"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<2",
  "einops>=0.7",
  "huggingface-hub>=0.25",
  "pydantic>=2.0",
  "safetensors>=0.4",
  "torch>=2.2",
  "scipy>=1.11,<2",
]

[project.scripts]
elpis = "elpis_reference.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src", "DarwinianMatrix" = "components/DarwinianMatrix"}
py-modules = ["DarwinianMatrix.geometry"]

[tool.setuptools.packages.find]
where = ["src", "components"]
include = [
  "elpis_reference*",
  "DarwinianMatrix.projector*",
]

[tool.setuptools.package-data]
elpis_reference = [
  "vendor/fprm/AUTHORITY.json",
  "vendor/fprm/all_config.yaml",
  "vendor/fprm/sudoku_inference_config.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
