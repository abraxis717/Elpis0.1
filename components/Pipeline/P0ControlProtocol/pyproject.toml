[build-system]
requires = [
  "setuptools>=69",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "elpis-p0-control-protocol"
version = "0.1.0"
description = "Shadow-only model-wide structural and TRM control protocol for Elpis Canon"
requires-python = ">=3.11"
dependencies = [
    "elpis-fractal-spine",
]

[project.optional-dependencies]
test = [
  "pytest>=8"
]

[project.scripts]
elpis-p0 = "elpis_p0.cli:main"

[tool.setuptools.packages.find]
where = [
  "src"
]

[tool.pytest.ini_options]
testpaths = [
  "tests"
]
addopts = "-q"
