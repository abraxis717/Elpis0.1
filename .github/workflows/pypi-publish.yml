name: PyPI trusted publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pypi-publish.yml
  workflow_dispatch:

concurrency:
  group: pypi-elpisai-2.1.21
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'publication: add PyPI trusted publisher workflow'
    name: exact-tag build, qualify, publish, readback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write

    env:
      TAG: Elpis2.1.21
      VERSION: '2.1.21'
      DIST_NAME: elpisai
      RELEASE_COMMIT: 2579566f4bb3bb5190a0321928d19c21f2d612bb
      TAG_OBJECT: 4b3accdba97d81aab6a59d89a4a4aab2d7f2b394
      MANIFEST_SHA: 83597eb4353688875f03618dd7ec548df83e6e601676f4e328e8a9cc25452f25
      EXPECTED_WORKFLOW_REF: abraxis717/Elpis0.1/.github/workflows/pypi-publish.yml@refs/heads/main

    steps:
      - name: Assert trusted workflow identity
        env:
          OBSERVED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$OBSERVED_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          echo "PASS_WORKFLOW_IDENTITY=$OBSERVED_WORKFLOW_REF"

      - name: Checkout immutable release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: Elpis2.1.21
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify immutable source authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "$TAG^{tag}")" = "$TAG_OBJECT"
          test "$(git rev-parse "$TAG^{}")" = "$RELEASE_COMMIT"
          test "$(sha256sum manifests/Elpis2.1.21.RELEASE_MANIFEST.json | awk '{print $1}')" = "$MANIFEST_SHA"
          python tools/verify_public_release.py
          mkdir -p publication-evidence
          printf '%s\n' "$RELEASE_COMMIT" > publication-evidence/release_commit.txt
          printf '%s\n' "$TAG_OBJECT" > publication-evidence/tag_object.txt
          printf '%s\n' "$MANIFEST_SHA" > publication-evidence/manifest_sha256.txt
          echo PASS_IMMUTABLE_SOURCE_AUTHORITY

      - name: Census PyPI immediately before build/upload
        id: pypi_pre
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o publication-evidence/pypi_pre.json -w '%{http_code}' "https://pypi.org/pypi/$DIST_NAME/$VERSION/json")"
          case "$code" in
            200)
              echo 'mode=readback' >> "$GITHUB_OUTPUT"
              echo 'READBACK_ONLY' > publication-evidence/pypi_mode.txt
              ;;
            404)
              rm -f publication-evidence/pypi_pre.json
              echo 'mode=publish' >> "$GITHUB_OUTPUT"
              echo 'PUBLISH' > publication-evidence/pypi_mode.txt
              ;;
            *)
              echo "unexpected PyPI HTTP $code" >&2
              exit 1
              ;;
          esac

      - name: Install build qualification tooling
        if: steps.pypi_pre.outputs.mode == 'publish'
        run: python -m pip install --upgrade pip build twine packaging

      - name: Build exact-tag wheel and sdist
        if: steps.pypi_pre.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          rm -rf dist build *.egg-info
          python -m build --sdist --wheel --outdir dist
          python -m twine check dist/*
          sha256sum dist/* | sort | tee publication-evidence/hosted_distribution_sha256.txt

      - name: Qualify distribution metadata and archive boundary
        if: steps.pypi_pre.outputs.mode == 'publish'
        run: |
          python - <<'PY'
          import email, hashlib, json, pathlib, re, tarfile, zipfile
          from packaging.requirements import Requirement

          root=pathlib.Path('.')
          wheels=sorted(pathlib.Path('dist').glob('*.whl'))
          sdists=sorted(pathlib.Path('dist').glob('*.tar.gz'))
          assert len(wheels)==1, wheels
          assert len(sdists)==1, sdists
          wheel,sdist=wheels[0],sdists[0]

          def meta(raw): return email.message_from_bytes(raw)
          def verify(msg, src):
              assert msg['Name']=='elpisai', (src,msg['Name'])
              assert msg['Version']=='2.1.21', (src,msg['Version'])
              assert msg['Requires-Python']=='>=3.11', (src,msg['Requires-Python'])
              assert msg.get('Description-Content-Type','').startswith('text/markdown')
              body=msg.get_payload(); assert isinstance(body,str) and len(body)>5000 and 'Elpis' in body
              urls=set(msg.get_all('Project-URL',[]))
              assert {
                'Homepage, https://github.com/abraxis717/Elpis0.1',
                'Repository, https://github.com/abraxis717/Elpis0.1',
                'Issues, https://github.com/abraxis717/Elpis0.1/issues',
                'Changelog, https://github.com/abraxis717/Elpis0.1/blob/main/CHANGELOG.md',
              } <= urls
              reqs=[Requirement(x) for x in msg.get_all('Requires-Dist',[])]
              by={}
              for r in reqs: by.setdefault(r.name.lower(),[]).append(r)
              assert str(by['numpy'][0].specifier)=='<2,>=1.26' and all(r.marker is None for r in by['numpy'])
              assert str(by['scipy'][0].specifier)=='<2,>=1.11' and all(r.marker is None for r in by['scipy'])
              for n in {'einops','huggingface-hub','pydantic','safetensors','torch'}:
                  assert n in by and all(r.marker is not None and 'extra == "trm"' in str(r.marker) for r in by[n])
              assert set(msg.get_all('Provides-Extra',[]))=={'trm'}

          forbidden=(
            'elpis_grid81_promotion_authority','elpis_grid81_candidate_constructor',
            'elpis_grid81_canonical_publisher','.astra_tmp','__pycache__','.pytest_cache',
            '.mypy_cache','.ruff_cache')
          weights=('.gguf','.safetensors','.ckpt','.pth','.pt')
          private=(b'/home/joe/',b'/mnt/primesauce/',b'/Users/abraxis/')
          allow=json.loads((root/'tools/public_scan_allowlist.json').read_text())
          permitted={}
          for row in allow:
              if row.get('kind')=='PRIVATE_PATH' and isinstance(row.get('path'),str) and isinstance(row.get('file_sha256'),str):
                  permitted.setdefault(row['path'],set()).add(row['file_sha256'])
          def private_fixture(rel,data):
              assert rel.startswith(('tests/','tools/')), rel
              assert rel in permitted, rel
              src=root/rel; assert src.is_file() and data==src.read_bytes(), rel
              assert hashlib.sha256(data).hexdigest() in permitted[rel], rel

          with zipfile.ZipFile(wheel) as z:
              names=z.namelist()
              metas=[n for n in names if n.endswith('.dist-info/METADATA')]
              eps=[n for n in names if n.endswith('.dist-info/entry_points.txt')]
              assert len(metas)==1 and len(eps)==1
              verify(meta(z.read(metas[0])),'wheel')
              ep=z.read(eps[0]).decode()
              assert re.search(r'(?m)^elpis\s*=\s*elpis_reference\.cli:main\s*$',ep)
              for n in names:
                  low=n.lower(); assert not any(x.lower() in low for x in forbidden),n; assert not low.endswith(weights),n
                  if not n.endswith('/'):
                      data=z.read(n); assert not any(x in data for x in private),n

          with tarfile.open(sdist,'r:gz') as t:
              members=[m for m in t.getmembers() if m.isfile()]
              pkg=[m for m in members if m.name.count('/')==1 and m.name.endswith('/PKG-INFO')]
              assert len(pkg)==1
              verify(meta(t.extractfile(pkg[0]).read()),'sdist')
              for m in members:
                  low=m.name.lower(); assert not any(x.lower() in low for x in forbidden),m.name; assert not low.endswith(weights),m.name
                  f=t.extractfile(m)
                  if f:
                      data=f.read()
                      if any(x in data for x in private):
                          rel=m.name.split('/',1)[1] if '/' in m.name else m.name
                          private_fixture(rel,data)
          print('PASS_DIST_ARCHIVE_POLICY')
          PY

      - name: Clean-install hosted wheel before upload
        if: steps.pypi_pre.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          python -m venv /tmp/elpis-preupload
          /tmp/elpis-preupload/bin/python -m pip install --upgrade pip >/dev/null
          /tmp/elpis-preupload/bin/python -m pip install --no-cache-dir dist/*.whl >/dev/null
          PYTHONPATH='' /tmp/elpis-preupload/bin/python - <<'PY'
          from importlib import import_module, util
          from importlib.metadata import metadata, version
          from importlib.resources import files
          import sys
          assert version('elpisai')=='2.1.21'
          md=metadata('elpisai'); assert md['Name']=='elpisai' and md['Version']=='2.1.21'
          for n in (
            'elpis','elpis_reference','DarwinianMatrix','elpis_p0','elpis_fractal_spine',
            'elpis_grid81_semantics','elpis_grid81_typed','elpis_grid81_groups',
            'elpis_grid81_adjudication','elpis_grid81_capability_authority',
            'elpis_grid81_consumption_compiler','elpis_grid81_application_executor',
            'elpis_grid81_promotion_planner','c_numpy_cortex','elpis_header',
            'elpis_runtime_r0','elpis_runtime_r1'):
              import_module(n)
          for n in ('elpis_grid81_promotion_authority','elpis_grid81_candidate_constructor','elpis_grid81_canonical_publisher'):
              assert util.find_spec(n) is None,n
          pkg=files('elpis_reference')
          for rel in ('vendor/fprm/AUTHORITY.json','vendor/fprm/all_config.yaml','vendor/fprm/sudoku_inference_config.json'):
              assert pkg.joinpath(rel).is_file(),rel
          import elpis.contracts, elpis_reference.structural_guidance
          assert 'torch' not in sys.modules
          print('PASS_HOSTED_PREUPLOAD_INSTALL')
          PY
          PYTHONPATH='' /tmp/elpis-preupload/bin/elpis --help | grep -q 'Runnable Elpis reference runtime'

      - name: Publish exact qualified distributions to PyPI via OIDC
        if: steps.pypi_pre.outputs.mode == 'publish'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

      - name: Read PyPI release back and bind published hashes
        id: readback
        run: |
          set -euo pipefail
          ok=0
          for _ in $(seq 1 40); do
            code="$(curl -sS -L -o publication-evidence/pypi_post.json.tmp -w '%{http_code}' "https://pypi.org/pypi/$DIST_NAME/$VERSION/json" || true)"
            if [ "$code" = 200 ]; then
              mv publication-evidence/pypi_post.json.tmp publication-evidence/pypi_post.json
              ok=1
              break
            fi
            rm -f publication-evidence/pypi_post.json.tmp
            sleep 3
          done
          test "$ok" = 1
          python - "${{ steps.pypi_pre.outputs.mode }}" <<'PY'
          import hashlib,json,pathlib,sys
          mode=sys.argv[1]
          obj=json.loads(pathlib.Path('publication-evidence/pypi_post.json').read_text())
          assert obj['info']['name'].lower()=='elpisai'
          assert obj['info']['version']=='2.1.21'
          by={u['packagetype']:u for u in obj.get('urls',[])}
          assert set(by)=={'bdist_wheel','sdist'}, [(u.get('filename'),u.get('packagetype')) for u in obj.get('urls',[])]
          w,s=by['bdist_wheel'],by['sdist']
          assert w['filename']=='elpisai-2.1.21-py3-none-any.whl'
          assert s['filename']=='elpisai-2.1.21.tar.gz'
          for u in (w,s): assert len(u['digests']['sha256'])==64
          pathlib.Path('publication-evidence/pypi_distribution_sha256.txt').write_text(
              f"{w['digests']['sha256']}  {w['filename']}\n{s['digests']['sha256']}  {s['filename']}\n")
          if mode=='publish':
              local={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('dist').iterdir() if p.is_file()}
              assert local[w['filename']]==w['digests']['sha256']
              assert local[s['filename']]==s['digests']['sha256']
          print('PASS_PYPI_EXACT_READBACK')
          PY

      - name: Clean-install from PyPI
        run: |
          set -euo pipefail
          python -m venv /tmp/elpis-pypi
          /tmp/elpis-pypi/bin/python -m pip install --upgrade pip >/dev/null
          installed=0
          for _ in $(seq 1 20); do
            if /tmp/elpis-pypi/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "elpisai==2.1.21" >/dev/null; then
              installed=1
              break
            fi
            sleep 3
          done
          test "$installed" = 1
          PYTHONPATH='' XDG_CACHE_HOME=/tmp/elpis-cache /tmp/elpis-pypi/bin/python - <<'PY' | tee publication-evidence/pypi_install_smoke.txt
          from importlib import import_module, util
          from importlib.metadata import metadata, version
          from importlib.resources import files
          import sys
          assert version('elpisai')=='2.1.21'
          md=metadata('elpisai'); assert md['Name']=='elpisai' and md['Version']=='2.1.21'
          for n in (
            'elpis','elpis_reference','DarwinianMatrix','elpis_p0','elpis_fractal_spine',
            'elpis_grid81_semantics','elpis_grid81_typed','elpis_grid81_groups',
            'elpis_grid81_adjudication','elpis_grid81_capability_authority',
            'elpis_grid81_consumption_compiler','elpis_grid81_application_executor',
            'elpis_grid81_promotion_planner','c_numpy_cortex','elpis_header',
            'elpis_runtime_r0','elpis_runtime_r1'):
              import_module(n)
          for n in ('elpis_grid81_promotion_authority','elpis_grid81_candidate_constructor','elpis_grid81_canonical_publisher'):
              assert util.find_spec(n) is None,n
          pkg=files('elpis_reference')
          for rel in ('vendor/fprm/AUTHORITY.json','vendor/fprm/all_config.yaml','vendor/fprm/sudoku_inference_config.json'):
              assert pkg.joinpath(rel).is_file(),rel
          import elpis.contracts, elpis_reference.structural_guidance
          assert 'torch' not in sys.modules
          print('PASS_PYPI_CLEAN_INSTALL')
          PY
          PYTHONPATH='' /tmp/elpis-pypi/bin/elpis --help > publication-evidence/pypi_elpis_help.txt
          grep -q 'Runnable Elpis reference runtime' publication-evidence/pypi_elpis_help.txt

      - name: Materialize hosted closure summary
        if: always()
        env:
          OBSERVED_WORKFLOW_REF: ${{ github.workflow_ref }}
          OBSERVED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          OBSERVED_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p publication-evidence
          {
            echo "workflow_ref=$OBSERVED_WORKFLOW_REF"
            echo "workflow_sha=$OBSERVED_WORKFLOW_SHA"
            echo "run_id=$OBSERVED_RUN_ID"
            echo "release_commit=$RELEASE_COMMIT"
            echo "tag_object=$TAG_OBJECT"
            echo "manifest_sha256=$MANIFEST_SHA"
          } > publication-evidence/hosted_closure_summary.txt

      - name: Upload publication closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elpis-2.1.21-pypi-publication-evidence
          path: publication-evidence/
          if-no-files-found: error
          retention-days: 90
