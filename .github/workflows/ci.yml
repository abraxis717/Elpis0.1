      - name: C2R7-A relational semantic IR E2E
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python tests/run_c2r7a_relational_semantic_ir_e2e.py
      - name: C2R7-A semantic IR red-team regression
        run: PYTHONDONTWRITEBYTECODE=1 python tools/redteam_c2r7a_semantic_ir.py --quiet
      - name: Legacy Grid81 semantic compiler diagnostic remains active
        run: PYTHONDONTWRITEBYTECODE=1 python tools/redteam_grid81_semantic_compiler.py --out /tmp/grid81-semantic-diagnostic.json --quiet

  c2r7b-semantic-sidecar-binding:
    name: C2R7-B semantic sidecar binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest==9.0.2
      - name: Semantic sidecar binding tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python -m pytest -q -p no:cacheprovider components/Pipeline/P0ControlProtocol/tests/test_semantic_binding.py
      - name: C2R7-B semantic sidecar E2E
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python tests/run_c2r7b_semantic_sidecar_e2e.py
      - name: C2R7-B sidecar red-team regression
        run: PYTHONDONTWRITEBYTECODE=1 python tools/redteam_c2r7b_semantic_sidecar.py --quiet
      - name: C2R7-A representation red-team remains green
        run: PYTHONDONTWRITEBYTECODE=1 python tools/redteam_c2r7a_semantic_ir.py --quiet
      - name: Legacy Grid81 semantic compiler diagnostic remains active
        run: PYTHONDONTWRITEBYTECODE=1 python tools/redteam_grid81_semantic_compiler.py --out /tmp/grid81-semantic-diagnostic.json --quiet

  furyan-r0:
    name: Furyan Locus Oracle R0
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest==9.0.2
      - name: Frozen Furyan R0 release integration
        run: python -m pytest -q -p no:cacheprovider tests/test_furyan_release_integration.py tests/test_joint_allocator.py

  semantic-spine-native:
    name: Root semantic-spine native qualification
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libsqlite3-dev \
            libssl-dev \
            libpcre2-dev \
            pkg-config
      - name: Root configure and build
        run: |
          cmake \
            -S . \
            -B /tmp/elpis-root-native \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/elpis-root-native --parallel
      - name: Require complete root native test registry
        run: |
          COUNT="$(
            ctest --test-dir /tmp/elpis-root-native -N \
              | sed -n 's/^Total Tests: //p'
          )"
          test "$COUNT" = "96"
          echo "ROOT_NATIVE_TEST_COUNT=$COUNT"
      - name: Run root native suite
        run: |
          ctest \
            --test-dir /tmp/elpis-root-native \
            --output-on-failure
      - name: Root warning-as-error build
        run: |
          cmake \
            -S . \
            -B /tmp/elpis-root-werror \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS=-Werror \
            -DCMAKE_CXX_FLAGS=-Werror
          cmake --build /tmp/elpis-root-werror --parallel
      - name: Configure semantic-spine ASAN and UBSAN
        run: |
          cmake \
            -S native/semantic-spine \
            -B /tmp/elpis-semantic-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DELPIS_HACF_ROOT="$GITHUB_WORKSPACE/native/hacf" \
            -DELPIS_ENABLE_ASAN=ON \
            -DELPIS_ENABLE_UBSAN=ON
          cmake --build /tmp/elpis-semantic-sanitized --parallel
      - name: Require complete sanitizer test registry
        run: |
          COUNT="$(
            ctest --test-dir /tmp/elpis-semantic-sanitized -N \
              | sed -n 's/^Total Tests: //p'
          )"
          test "$COUNT" = "96"
          echo "SEMANTIC_SANITIZER_TEST_COUNT=$COUNT"
      - name: Run semantic-spine ASAN and UBSAN suite
        run: |
          ctest \
            --test-dir /tmp/elpis-semantic-sanitized \
            --output-on-failure

  repository-completeness:
    name: Repository completeness and installed artifact
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Read-only assembly/tooling gates before installation
        run: |
          python tools/verify_canonical_assembly.py
          python tools/print_component_map.py >/tmp/elpis-component-map.txt
          PYTHONPATH=src python tools/qualify_allocator_budget.py >/tmp/elpis-allocator-budget.json
      - name: Complete declared top-level test suite
        run: python -m pip install ".[trm]" pytest==9.0.2
      - run: python -m pytest -q -p no:cacheprovider tests/
      - name: Qualify installed assembly from pristine throwaway source copy
        run: |
          SRC="$(mktemp -d)"
          VENV="$(mktemp -d)"
          git archive HEAD | tar -x -C "$SRC"
          python -m venv "$VENV/venv"
          "$VENV/venv/bin/python" -m pip install --upgrade pip
          "$VENV/venv/bin/python" -m pip install "$SRC[trm]" pytest==9.0.2
          ELPIS_TEST_SOURCE="$SRC" PYTHONPATH="" "$VENV/venv/bin/python" - <<'PY'
          import importlib
          packages = (
              "elpis", "elpis_reference", "DarwinianMatrix", "elpis_p0",
              "elpis_fractal_spine", "elpis_grid81_semantics",
              "elpis_grid81_typed", "elpis_grid81_groups",
              "elpis_grid81_adjudication", "elpis_grid81_capability_authority",
              "elpis_grid81_consumption_compiler",
              "elpis_grid81_application_executor",
              "elpis_grid81_promotion_planner", "c_numpy_cortex",
              "elpis_header", "elpis_runtime_r0", "elpis_runtime_r1",
          )
          for name in packages:
              importlib.import_module(name)

          import os, struct
          from elpis_reference.ecs_r0 import Candidate, FrozenTheta, R0Error
          raw = struct.pack("<d", 1.0) * (6 * 36)
          os.environ.pop("ELPIS_ECS_AUTHORITY_ROOT", None)
          try:
              FrozenTheta(36, raw)
          except R0Error as exc:
              assert exc.code == "AUTHORITY_ROOT_REQUIRED"
          else:
              raise AssertionError("installed ECS R0 invented an authority root")
          os.environ["ELPIS_ECS_AUTHORITY_ROOT"] = os.environ["ELPIS_TEST_SOURCE"]
          candidate = Candidate.bind(FrozenTheta(36, raw))
          assert candidate.materialize() == raw
          print(f"PASS_INSTALLED_ASSEMBLY_IMPORTS={len(packages)}")
          print("PASS_INSTALLED_ECS_AUTHORITY_RELOCATION")
          PY
