      - name: Authority primitive tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python -m pytest -q -p no:cacheprovider components/Pipeline/P0ControlProtocol/tests/test_lineage_authority.py
      - name: Authority primitive E2E
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python tests/run_c2r6ca_controller_authority_e2e.py
      - name: C2R6C-A ownership red-team regression
        run: PYTHONDONTWRITEBYTECODE=1 python tools/redteam_c2r6ca_lineage_authority.py --quiet

  c2r6cb-trusted-controller-ingress:
    name: C2R6C-B trusted-controller ingress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[trm]" pytest==9.0.2
      - name: Production trusted ingress tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python -m pytest -q -p no:cacheprovider tests/test_p0_validator_ingress.py
      - name: C2R6C-B trusted ingress E2E
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python tests/run_c2r6cb_trusted_ingress_e2e.py
      - name: C2R6C-B ingress red-team regression
        run: PYTHONDONTWRITEBYTECODE=1 python tools/redteam_c2r6cb_ingress_authority.py --quiet

  c2r7a-relational-semantic-ir:
    name: C2R7-A relational semantic IR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
