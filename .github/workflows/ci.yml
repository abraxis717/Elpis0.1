name: CI

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags: ['v*', 'Elpis*']
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  verify:
    name: Public release verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: python tools/verify_public_release.py
      - run: python -m pytest tests/test_release_tag_qualification.py

  release-guards:
    name: Release and authority negative branches
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/mutation_suite.py
      - run: python -m pip install pytest
      - run: python -m pytest -p no:cacheprovider tests/test_runtime_guard_mutations.py tests/test_release_sealer_guards.py tests/test_seal_release_mutations.py
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: python -m pytest -p no:cacheprovider tests/test_authority_receipt_verification.py

  grid81:
    name: Grid81 aggregate suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==9.0.2 numpy
      - run: >
          PYTHONPATH=components/Grid81StructuralSemantics/src:components/Grid81TypedProjectionCompiler/src:components/Grid81StructuralGroupProjectionCompiler/src:components/Grid81DeterministicStructuralAdjudicator/src
          pytest components/Grid81StructuralSemantics/tests/ -v

  cnum-py-cortex-airgap:
    name: CNumPyCortex airgap policy
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install airgap test dependencies
        run: |
          python -m pip install pytest==9.0.2 numpy
          sudo apt-get update
          sudo apt-get install -y iproute2
      - name: Run Python defense-in-depth and subprocess regressions
        run: |
          PYTHONPATH=components/CNumPyCortex/src \
            python -m pytest \
              -q -p no:cacheprovider \
              components/CNumPyCortex/tests/test_airgap.py \
              components/CNumPyCortex/tests/test_airgap_config.py \
              components/CNumPyCortex/tests/test_subprocess_policy.py
      - name: Prove OS-level network isolation independently of Python
        run: |
          sudo unshare --net -- bash -eu -c '
            ip link set lo up
            python components/CNumPyCortex/tests/os_airgap_witness.py
          '

  runtime-r0:
    name: Runtime R0 suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==9.0.2 numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: >
          PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src
          pytest runtime/R0/tests/ -v

  hacf-native:
    name: HACF native build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsqlite3-dev
      - name: Build HACF
        run: |
          cmake -S native/hacf -B native/hacf/build -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build native/hacf/build --parallel
      - name: Run HACF native tests
        run: ctest --test-dir native/hacf/build --output-on-failure

  hacf-wrapper:
    name: HACF wrapper build and load audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsqlite3-dev
      - name: Build HACF
        run: |
          cmake -S native/hacf -B native/hacf/build -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build native/hacf/build --parallel
      - name: Build R1 wrapper
        run: |
          cmake -S native/hacf_bridge -B native/hacf_bridge/build \
            -DHACF_INCLUDE_DIR="$(pwd)/native/hacf/include" \
            -DHACF_LIB_DIR="$(pwd)/native/hacf/build"
          cmake --build native/hacf_bridge/build --parallel
      - name: Wrapper load audit
        run: |
          python3 -c "import ctypes; ctypes.CDLL('native/hacf_bridge/build/libr1_hacf_wrapper.so'); print('WRAPPER LOAD: OK')"
      - name: Check unresolved symbols
        run: |
          UNRESOLVED=$(ldd -r native/hacf_bridge/build/libr1_hacf_wrapper.so 2>&1 | grep "undefined symbol" || true)
          if [ -n "$UNRESOLVED" ]; then
            echo "UNRESOLVED SYMBOLS:"
            echo "$UNRESOLVED"
            exit 1
          fi
          echo "Unresolved symbols: 0"

  hacf-sanitizers:
    name: HACF ASAN+UBSAN native and ctypes boundary
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sanitizer qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev
          python -m pip install pytest==9.0.2 numpy
      - name: Resolve sanitizer runtimes
        run: |
          ASAN_LIB="$(gcc -print-file-name=libasan.so)"
          UBSAN_LIB="$(gcc -print-file-name=libubsan.so)"
          test -f "$ASAN_LIB"
          test -f "$UBSAN_LIB"
          echo "ASAN_LIB=$ASAN_LIB" >> "$GITHUB_ENV"
          echo "UBSAN_LIB=$UBSAN_LIB" >> "$GITHUB_ENV"
      - name: Build HACF with ASAN and UBSAN
        run: |
          cmake \
            -S native/hacf \
            -B /tmp/elpis-hacf-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DELPIS_ENABLE_ASAN=ON \
            -DELPIS_ENABLE_UBSAN=ON \
            -DELPIS_ENABLE_TSAN=OFF
          cmake --build /tmp/elpis-hacf-sanitized --parallel
      - name: Run native HACF sanitizer suite with leak detection
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          LD_PRELOAD="$ASAN_LIB:$UBSAN_LIB" \
            ctest \
              --test-dir /tmp/elpis-hacf-sanitized \
              --output-on-failure
      - name: Build sanitized R1 ctypes wrapper
        run: |
          SAN_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-optimize-sibling-calls"
          cmake \
            -S native/hacf_bridge \
            -B /tmp/elpis-hacf-wrapper-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHACF_INCLUDE_DIR="$GITHUB_WORKSPACE/native/hacf/include" \
            -DHACF_LIB_DIR=/tmp/elpis-hacf-sanitized \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" \
            -DCMAKE_CXX_FLAGS="$SAN_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build /tmp/elpis-hacf-wrapper-sanitized --parallel
          ldd /tmp/elpis-hacf-wrapper-sanitized/libr1_hacf_wrapper.so \
            | tee /tmp/elpis-hacf-wrapper-ldd.txt
          grep -Eq 'libasan\.so' /tmp/elpis-hacf-wrapper-ldd.txt
          grep -Eq 'libubsan\.so' /tmp/elpis-hacf-wrapper-ldd.txt
      - name: Load ctypes wrapper under ASAN and UBSAN
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=0:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          LD_PRELOAD="$ASAN_LIB:$UBSAN_LIB" \
            python -c "import ctypes; ctypes.CDLL('/tmp/elpis-hacf-wrapper-sanitized/libr1_hacf_wrapper.so'); print('SANITIZED WRAPPER LOAD: OK')"
      - name: Run real R1 ctypes retrieval boundary under ASAN and UBSAN
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=0:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          HACF_WRAPPER_LIB: /tmp/elpis-hacf-wrapper-sanitized/libr1_hacf_wrapper.so
          PYTHONPATH: runtime/R1/src:src:components:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src
        run: |
          LD_PRELOAD="$ASAN_LIB:$UBSAN_LIB" \
            python -m pytest \
              -q -p no:cacheprovider \
              runtime/R1/tests/test_r1.py::TestHacfRetrieval
      - name: Run full R1 suite under sanitized wrapper
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=0:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          HACF_WRAPPER_LIB: /tmp/elpis-hacf-wrapper-sanitized/libr1_hacf_wrapper.so
          PYTHONPATH: runtime/R1/src:src:components:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src
        run: |
          LD_PRELOAD="$ASAN_LIB:$UBSAN_LIB" \
            python -m pytest \
              -q -p no:cacheprovider \
              runtime/R1/tests/test_r1.py

  runtime-r1:
    name: Runtime R1 suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==9.0.2 numpy
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsqlite3-dev
      - name: Build HACF
        run: |
          cmake -S native/hacf -B native/hacf/build -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build native/hacf/build --parallel
      - name: Build R1 wrapper
        run: |
          cmake -S native/hacf_bridge -B native/hacf_bridge/build \
            -DHACF_INCLUDE_DIR="$(pwd)/native/hacf/include" \
            -DHACF_LIB_DIR="$(pwd)/native/hacf/build"
          cmake --build native/hacf_bridge/build --parallel
      - run: >
          PYTHONPATH=runtime/R1/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src
          HACF_WRAPPER_LIB=native/hacf_bridge/build/libr1_hacf_wrapper.so
          pytest runtime/R1/tests/ -v

  secret-scan:
    name: Secret, private-path, and artifact scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==9.0.2
      - name: Run secret scanner
        run: python tools/ci_secret_scan.py .
      - name: Run secret scanner tests
        run: PYTHONPATH=. pytest tests/test_ci_secret_scan.py -v
      - name: Check for generated artifacts (exclude .git and __pycache__)
        run: |
          find . -not -path "./.git/*" -not -path "*/__pycache__/*" \( -name "*.so" -o -name "*.a" -o -name "*.o" -o -name "*.pyc" -o -name "*.egg" \) -print 2>/dev/null
          if find . -not -path "./.git/*" -not -path "*/__pycache__/*" \( -name "*.so" -o -name "*.a" -o -name "*.o" -o -name "*.egg" \) -print 2>/dev/null | grep -q .; then
            echo "BINARY ARTIFACTS DETECTED (excluding __pycache__)"
            exit 1
          fi
          echo "Binary artifact scan: CLEAN"
      - name: Check for model weights
        run: |
          if find . -not -path "./.git/*" \( -name "*.gguf" -o -name "*.safetensors" -o -name "*.pt" \) -print 2>/dev/null | grep -q .; then
            echo "MODEL WEIGHTS DETECTED"
            exit 1
          fi
          echo "Model weight scan: CLEAN"

  canonical-projector-release:
    name: Canonical Projector RELEASE adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[trm]" pytest==9.0.2
      - name: Installed semantic and adapter tests
        run: PYTHONPATH="" python -m pytest -q -p no:cacheprovider tests/test_semantic_refinement_contract.py tests/test_projector_release_adapter.py
      - name: Canonical Projector source tests
        run: PYTHONPATH=components python -m pytest -q -p no:cacheprovider components/DarwinianMatrix/tests/test_projector_constraints.py

  c2r3-bounded-feedback:
    name: C2R3 bounded learned feedback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[trm]" pytest==9.0.2
      - name: Installed C2R3 feedback tests
        run: PYTHONPATH="" python -m pytest -q -p no:cacheprovider tests/test_feedback_refinement.py

  c2r5-p0-artifact-proposal-lineage:
    name: C2R5 P0 artifact proposal lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[trm]" pytest==9.0.2
      - name: Production P0 validator ingress tests
        run: PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python -m pytest -q -p no:cacheprovider tests/test_p0_validator_ingress.py tests/test_p0_artifact_lineage.py tests/test_direct_semantic_replay.py
      - name: Red-team release and feedback regressions
        run: PYTHONPATH="" python -m pytest -q -p no:cacheprovider tests/test_projector_release_adapter.py tests/test_feedback_refinement.py

  c2r6b-p0-semantic-topology:
    name: C2R6B P0 semantic topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[trm]" pytest==9.0.2
      - name: P0 semantic-space and validator sub-locus tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python -m pytest -q -p no:cacheprovider components/Pipeline/P0ControlProtocol/tests/test_semantic_space.py tests/test_p0_validator_ingress.py
      - name: C2R6B semantic topology E2E
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src python tests/run_c2r6b_p0_semantic_topology_e2e.py
      - name: Offline Grid81 semantic compiler red-team
        run: PYTHONDONTWRITEBYTECODE=1 python tools/redteam_grid81_semantic_compiler.py --out /tmp/grid81-semantic-diagnostic.json --quiet

  c2r6ca-controller-authority-primitive:
