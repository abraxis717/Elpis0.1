name: platform-matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portable-contracts:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python tools/setup.py --profile reference --dry-run

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -e . --no-deps pytest

      - run: python -m pytest -q -p no:cacheprovider tests/test_platform_setup.py tests/test_semantic_refinement_contract.py
