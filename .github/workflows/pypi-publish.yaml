name: pypi-publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: build tagged distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag/version and public release
        shell: bash
        run: |
          set -euo pipefail
          test "Elpis$(cat VERSION)" = "${{ github.event.release.tag_name }}"
          python tools/verify_public_release.py

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions for isolated publish job
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to PyPI with OIDC
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/elpisai
    permissions:
      id-token: write
    steps:
      - name: Download tagged distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
