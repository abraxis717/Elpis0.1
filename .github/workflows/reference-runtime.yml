name: reference-runtime

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
  workflow_dispatch:

jobs:
  reference-runtime-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify public/distribution tree
        run: python tools/verify_public_release.py

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Installed package and package-data smoke
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/elpis-cache
        run: |
          PYTHONPATH="" python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from pathlib import Path
          import os

          from elpis_reference.model import (
              MODEL_FILENAME,
              default_cache_dir,
              default_model_path,
          )

          assert version("elpis") == "2.1.0"

          package = files("elpis_reference")

          for rel in (
              "vendor/fprm/AUTHORITY.json",
              "vendor/fprm/all_config.yaml",
              "vendor/fprm/sudoku_inference_config.json",
          ):
              assert package.joinpath(rel).is_file(), rel

          expected = (
              Path(os.environ["XDG_CACHE_HOME"])
              / "elpis"
              / "models"
          )

          assert default_cache_dir() == expected
          assert default_model_path() == expected / MODEL_FILENAME

          print("PASS_INSTALLED_PACKAGE_SMOKE")
          PY

      - name: Construct FPRM architecture without checkpoint
        run: |
          PYTHONPATH="" python - <<'PY'
          import torch

          from elpis_reference.model import (
              REGISTERED_PARAMETER_COUNT,
              _new_model,
          )

          model = _new_model(torch.device("cpu"))

          count = sum(
              int(parameter.numel())
              for parameter in model.parameters()
          )

          assert count == REGISTERED_PARAMETER_COUNT

          print(f"parameter_abi={count}")
          print("PASS_MODEL_BLIND_FPRM_ABI")
          PY

      - name: Model-blind Sudoku runtime tests
        run: |
          PYTHONPATH="" python -m pytest \
            -q -p no:cacheprovider \
            tests/test_reference_runtime.py \
            -k 'not test_fprm_model_abi_constructs_on_cpu'

      - name: Model-blind feedback and Projector regression
        run: |
          PYTHONPATH="" python -m pytest \
            -q -p no:cacheprovider \
            tests/test_feedback_refinement.py \
            tests/test_projector_release_adapter.py

  validated-source-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Validated-source runtime smoke
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONPATH=runtime/R0/src:components/TRMFractalSpine/src:components/Grid81DeterministicStructuralAdjudicator/src:components/Grid81StructuralSemantics/src:components/Pipeline/P0ControlProtocol/src:components:src \
          python -m pytest \
            -q -p no:cacheprovider \
            tests/test_structural_guidance_validated_source_runtime.py \
            tests/test_structural_guidance_runtime_admission.py \
            tests/test_structural_guidance_structural_validator.py \
            tests/test_structural_guidance_validation_authority.py \
            tests/test_python_ast_policy_convergence.py
