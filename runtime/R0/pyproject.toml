[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elpis-runtime-r0"
version = "0.1.0"
description = "Elpis Runtime Integration R0 — Deterministic structural transaction"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
